name: edu_platform
description: منصة تعليمية للطلاب - اختبارات ودروس
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # Routing
  go_router: ^14.2.0

  # Forms
  reactive_forms: ^17.0.1

  # Models (immutable + json)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Local storage / cache
  shared_preferences: ^2.5.3
  path_provider: ^2.1.3

  # PDF viewing — مفتوح المصدر بالكامل (MIT)، لا ترخيص تجاري مطلوب
  pdfx: ^2.6.0

  # File handling
  file_picker: ^8.0.6
  mime: ^1.0.5

  # Push Notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Utils
  package_info_plus: ^8.0.2
  equatable: ^2.0.5
  logger: ^2.4.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.5

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/images/
    - .env
